<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ESP32 APRS Monitor</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#111;color:#e0e0e0;font-family:monospace;min-height:100vh;padding:1rem}
.app{height:calc(100dvh - 2rem);display:grid;grid-template-rows:1fr 2fr 1fr;gap:1rem;
  max-width:960px;margin:0 auto}
.panel{background:#0d0d0d;border:1px solid #2a2a2a;border-radius:4px;overflow:hidden}
#top-panel{display:flex;flex-direction:column;align-items:center;justify-content:center;
     gap:.9rem;padding:1rem;text-align:center}
h1{font-size:1.2rem;letter-spacing:.1em;color:#7ecfff}
#status{font-size:.8rem;color:#888;min-height:1.2em}
#btn{padding:.7rem 2rem;font-size:1rem;font-family:monospace;background:#1a3a5c;
  color:#7ecfff;border:1px solid #7ecfff;border-radius:4px;cursor:pointer;transition:background .2s}
#btn:hover{background:#254f80}
#btn:disabled{opacity:.4;cursor:default}
#meter-wrap{width:260px;height:12px;background:#1a1a1a;border:1px solid #333;
            border-radius:2px;overflow:hidden}
#meter{height:100%;width:0;
       background:linear-gradient(90deg,#2a8a2a,#8a8a2a,#8a2a2a);transition:width .05s}
#log-hdr{padding:.35rem .6rem;font-size:.7rem;color:#4a9a4a;
         border-bottom:1px solid #1a2a1a;letter-spacing:.08em;
         display:flex;align-items:center;justify-content:space-between}
#dl-btn{font-size:.6rem;font-family:monospace;background:none;border:1px solid #2a4a2a;
  color:#4a9a4a;border-radius:3px;padding:.15rem .45rem;cursor:pointer;line-height:1.4;
  transition:background .15s}
#dl-btn:hover{background:#0d1e0d}
#log-wrap{display:flex;flex-direction:column;min-height:0}
#log{flex:1;min-height:0;overflow-y:auto;padding:.5rem .6rem;
  display:flex;flex-direction:column;gap:.45rem}
.pkt{font-size:.7rem;line-height:1.45}
.pkt .ts{color:#555;margin-right:.5rem}
.pkt .src{color:#7ecfff;font-weight:bold;cursor:pointer;text-decoration:underline dotted}
.pkt .src:hover{color:#b0e8ff}
.pkt .sep{color:#6d6d6d}
.pkt .dst{color:#f0b35a}
.pkt .path{color:#8acb88}
.pkt .info{color:#c0e0a0;word-break:break-all}
.pkt-me{background:#0d1e0d;border-left:2px solid #4a9a4a}
.pkt-ack{background:#1a1400;border-left:2px solid #c8a04a}
.ack-badge{display:inline-block;font-size:.6rem;padding:.05rem .3rem;
  background:#2a2000;border:1px solid #c8a04a;border-radius:2px;
  color:#c8a04a;margin-right:.35rem;vertical-align:middle}
.me-badge{display:inline-block;font-size:.6rem;padding:.05rem .3rem;
  background:#0a280a;border:1px solid #4a9a4a;border-radius:2px;
  color:#4fc84f;margin-right:.35rem;vertical-align:middle}
.pkt-sent{background:#1a1400;border-left:2px solid #c8a04a;padding-left:.4rem}
.pkt .tx-lbl{color:#c8a04a;font-weight:bold}
.pkt .tx-arr{color:#6d6d6d}
#info{font-size:.7rem;color:#555;text-align:center;line-height:1.6;margin-top:auto}
.tab-bar{display:flex;border-bottom:1px solid #2a1a00;flex-shrink:0}
.tab-btn{flex:1;padding:.35rem;font-size:.65rem;font-family:monospace;background:none;
  border:none;color:#666;cursor:pointer;letter-spacing:.06em;
  border-bottom:2px solid transparent;transition:color .15s}
.tab-btn.active{color:#c8a04a;border-bottom:2px solid #c8a04a}
.tab-pane{display:none;padding:.75rem;flex-direction:column;gap:.6rem;flex:1;min-height:0;
  justify-content:center}
.tab-pane.active{display:flex}
#gps-btn{padding:.35rem .5rem;font-size:.7rem;font-family:monospace;background:#0d1e0d;
  color:#4a9a4a;border:1px solid #4a9a4a;border-radius:3px;cursor:pointer;white-space:nowrap}
#gps-btn:hover{background:#162816}#gps-btn:disabled{opacity:.4;cursor:default}
.map-link{text-decoration:none;font-size:.8rem;margin-left:.25rem;opacity:.9}
.map-link:hover{opacity:1}
.pos-badge{display:inline-block;font-size:.6rem;padding:.05rem .3rem;background:#001830;
  border:1px solid #7ecfff;border-radius:2px;color:#7ecfff;margin-right:.3rem;
  vertical-align:middle}
#pos-btn{padding:.4rem 1rem;font-size:.75rem;font-family:monospace;background:#1a3a5c;
  color:#7ecfff;border:1px solid #7ecfff;border-radius:3px;cursor:pointer;
  transition:background .2s;white-space:nowrap}
#pos-btn:hover{background:#254f80}#pos-btn:disabled{opacity:.4;cursor:default}
#pos-sym{background:#111;color:#e0e0e0;border:1px solid #333;border-radius:3px;
  font-family:monospace;font-size:.7rem;padding:.3rem .4rem}
#cfg-editor{flex:1;min-height:8rem;background:#0a0a0a;color:#b0e0b0;border:1px solid #2a3a2a;
  border-radius:3px;font-family:monospace;font-size:.65rem;resize:vertical;padding:.5rem;
  line-height:1.5;white-space:pre;overflow:auto}
#cfg-save-btn{padding:.4rem 1rem;font-size:.75rem;font-family:monospace;background:#0d2a0d;
  color:#4fc84f;border:1px solid #4a9a4a;border-radius:3px;cursor:pointer;transition:background .2s}
#cfg-save-btn:hover{background:#163816}#cfg-save-btn:disabled{opacity:.4;cursor:default}
#cfg-status{font-size:.65rem;color:#888;margin-left:.5rem;flex:1}
#send-hdr{padding:.35rem .6rem;font-size:.7rem;color:#c8a04a;
          border-bottom:1px solid #2a1a00;letter-spacing:.08em}
#send-wrap{display:flex;flex-direction:column}
#send-form{padding:.8rem;display:flex;flex-direction:column;gap:.7rem;justify-content:center;flex:1}
.send-row{display:flex;gap:.4rem;align-items:center}
.send-row label{font-size:.7rem;color:#888;min-width:3.5rem}
.send-row input,.send-row select{
  background:#111;color:#e0e0e0;border:1px solid #333;border-radius:3px;
  font-family:monospace;font-size:.75rem;padding:.3rem .4rem}
#send-to{flex:1;text-transform:uppercase}
#send-ssid{width:3.5rem}
#send-text{flex:1}
#send-btn{padding:.4rem 1rem;font-size:.75rem;font-family:monospace;
          background:#3a2a00;color:#c8a04a;border:1px solid #c8a04a;
          border-radius:3px;cursor:pointer;transition:background .2s;white-space:nowrap}
#send-btn:hover{background:#5a4000}
#send-btn:disabled{opacity:.4;cursor:default}
#send-status{font-size:.65rem;min-height:1rem;color:#888;padding:0 .1rem}
@media (max-width:700px){
  body{padding:.6rem}
  .app{height:auto;min-height:calc(100dvh - 1.2rem);grid-template-rows:auto minmax(16rem,1fr) auto;gap:.75rem}
  #top-panel{padding:.85rem;gap:.7rem}
  .send-row{flex-wrap:wrap}
  .send-row label{min-width:auto}
  #send-to,#send-text{width:100%}
}
</style>
</head>
<body>
<div class="app">
  <div id="top-panel" class="panel">
    <h1>&#x1F4FB; ESP32 APRS Monitor</h1>
    <div id="status">Conectando...</div>
    <button id="btn" onclick="toggle()" disabled>&#x25B6; Escuchar</button>
    <div id="meter-wrap"><div id="meter"></div></div>
    <div id="info">
      IMA ADPCM &middot; 9600 Hz &middot; 38.4 kbps<br>
      VLC/ffplay: <code>http://HOST:8080/audio</code>
    </div>
  </div>
  <div id="log-wrap" class="panel">
    <div id="log-hdr"><span>APRS LOG</span><button id="dl-btn" onclick="downloadLog()" title="Descargar log como CSV">&#x2B07; CSV</button></div>
    <div id="log"></div>
  </div>
  <div id="send-wrap" class="panel">
    <div class="tab-bar">
      <button class="tab-btn active" onclick="showTab('msg',this)">MENSAJE</button>
      <button class="tab-btn" onclick="showTab('pos',this)">POSICIÓN</button>
      <button class="tab-btn" onclick="showTab('cfg',this)">CONFIG</button>
    </div>
    <div id="tab-msg" class="tab-pane active">
      <div class="send-row">
        <label>Destino</label>
        <input id="send-to" type="text" maxlength="6" placeholder="NO0CAL" spellcheck="false" autocomplete="off">
        <label style="min-width:2rem">SSID</label>
        <select id="send-ssid">
          <option value="-1">—</option>
          <option value="0" selected>0</option>
          <option value="1">1</option><option value="2">2</option>
          <option value="3">3</option><option value="4">4</option>
          <option value="5">5</option><option value="6">6</option>
          <option value="7">7</option><option value="8">8</option>
          <option value="9">9</option><option value="10">10</option>
          <option value="11">11</option><option value="12">12</option>
          <option value="13">13</option><option value="14">14</option>
          <option value="15">15</option>
        </select>
      </div>
      <div class="send-row">
        <label>Mensaje</label>
        <input id="send-text" type="text" maxlength="67" placeholder="Hola desde ESP32-APRS" spellcheck="false">
        <button id="send-btn" onclick="sendAPRS()">&#x2191; Enviar</button>
      </div>
      <div id="send-status"></div>
    </div>
    <div id="tab-pos" class="tab-pane">
      <div class="send-row">
        <button id="gps-btn" onclick="getGPS()">&#x1F4CD; GPS</button>
        <label style="min-width:2rem">Lat</label>
        <input id="pos-lat" type="number" step="any" min="-90" max="90" placeholder="40.41680" style="flex:1;min-width:3.5rem">
        <label style="min-width:2rem">Lon</label>
        <input id="pos-lon" type="number" step="any" min="-180" max="180" placeholder="-3.70380" style="flex:1;min-width:3.5rem">
      </div>
      <div class="send-row">
        <label>Símbolo</label>
        <select id="pos-sym">
          <option value="&gt;">&gt; Coche</option>
          <option value="-">- Casa</option>
          <option value="k">k SUV/4x4</option>
          <option value="Y">Y Barco</option>
          <option value="j">j Avión</option>
          <option value="#"># Digipeater</option>
          <option value="r">r RX-only</option>
          <option value="n">n MESH</option>
        </select>
        <label style="min-width:3.5rem">Comentario</label>
        <input id="pos-comment" type="text" maxlength="43" placeholder="ESP32-APRS" style="flex:1">
      </div>
      <div class="send-row">
        <button id="pos-btn" onclick="sendBeacon()">&#x1F4E1; Transmitir baliza</button>
        <span id="pos-status" style="font-size:.65rem;color:#888;margin-left:.5rem;flex:1"></span>
      </div>
    </div>
    <div id="tab-cfg" class="tab-pane" style="justify-content:flex-start">
      <textarea id="cfg-editor" spellcheck="false" autocorrect="off" autocapitalize="off"></textarea>
      <div class="send-row" style="flex-shrink:0">
        <button id="cfg-save-btn" onclick="saveCfg()">&#x1F4BE; Guardar y aplicar</button>
        <span id="cfg-status"></span>
      </div>
    </div>
  </div>
</div>
<script>
// ── IMA ADPCM decoder ──────────────────────────────────────────────────────
const STEP=[7,8,9,10,11,12,13,14,16,17,19,21,23,25,28,31,34,37,41,45,50,55,
  60,66,73,80,88,97,107,118,130,143,157,173,190,209,230,253,279,307,337,371,
  408,449,494,544,598,658,724,796,876,963,1060,1166,1282,1411,1552,1707,1878,
  2066,2272,2499,2749,3024,3327,3660,4026,4428,4871,5358,5894,6484,7132,7845,
  8630,9493,10442,11487,12635,13899,15289,16818,18500,20350,22385,24623,27086,
  29794,32767];
const IDX=[-1,-1,-1,-1,2,4,6,8];
function decodeBlock(buf){
  const v=new DataView(buf),raw=new Uint8Array(buf);
  let pred=v.getInt16(0,true),si=Math.min(Math.max(raw[2],0),88);
  const out=new Float32Array(1017);out[0]=pred/32768;let oi=1;
  for(let i=4;i<512;i++){const b=raw[i];
    for(let h=0;h<2;h++){const n=h===0?(b&0xF):(b>>4),st=STEP[si];
      let d=st>>3;if(n&4)d+=st;if(n&2)d+=st>>1;if(n&1)d+=st>>2;
      pred+=(n&8)?-d:d;
      if(pred>32767)pred=32767;if(pred<-32768)pred=-32768;
      si+=IDX[n&7];if(si<0)si=0;if(si>88)si=88;out[oi++]=pred/32768;}}
  return out;
}
// ── AudioContext ───────────────────────────────────────────────────────────
const SR=9600;let actx=null,nextAt=0;
function scheduleBlock(s){
  const b=actx.createBuffer(1,s.length,SR);b.copyToChannel(s,0);
  const n=actx.createBufferSource();n.buffer=b;n.connect(actx.destination);
  const now=actx.currentTime;if(nextAt<now+0.05)nextAt=now+0.05;
  n.start(nextAt);nextAt+=s.length/SR;
  let sum=0;for(let i=0;i<s.length;i++)sum+=s[i]*s[i];
  document.getElementById('meter').style.width=
    Math.min(Math.sqrt(sum/s.length)*400,100)+'%';
}
// ── APRS log ───────────────────────────────────────────────────────────────
const MAX_LOG=100;const logData=[];let myCall='',mySsid=-1;
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fillDest(src){
  const m=src.match(/^([A-Z0-9]+)(?:-(\d+))?$/);
  if(!m)return;
  document.getElementById('send-to').value=m[1];
  const si=document.getElementById('send-ssid');
  si.value=(m[2]!=null)?m[2]:'0';
  document.getElementById('send-text').focus();
}
function appendLog(src,dst,path,info){
  const log=document.getElementById('log');
  while(log.children.length>=MAX_LOG)log.removeChild(log.lastChild);
  const d=document.createElement('div');d.className='pkt';
  const ts=new Date().toLocaleTimeString('es',
    {hour:'2-digit',minute:'2-digit',second:'2-digit'});
  // Detect ACK: info = "ackNNN" (after stripping addressee wrapper from raw info)
  const isAck=/^ack\d+$/i.test(info.trim());
  // Detect message to me: dst matches our callsign+ssid
  const myAddr=myCall+(mySsid>0?'-'+mySsid:'');
  const isToMe=myAddr&&dst.trim().toUpperCase()===myAddr.toUpperCase();
  if(isAck)d.classList.add('pkt-ack');
  else if(isToMe)d.classList.add('pkt-me');
  let badge='';
  if(isAck)badge='<span class="ack-badge">ACK</span>';
  else if(isToMe)badge='<span class="me-badge">PARA MÍ</span>';
  const pos=parseAPRSPos(info);
  const mapLink=pos
    ?` <a class="map-link" href="https://maps.google.com/?q=${pos.lat},${pos.lon}" target="_blank" rel="noopener" title="Ver en Google Maps (${pos.lat},${pos.lon})">&#x1F5FA;&#xFE0F;</a>`
    :'';
  const posBadge=pos?'<span class="pos-badge">POS</span>':'';
  d.innerHTML=`<span class="ts">${ts}</span>${badge}${posBadge}`+
    `<span class="src" onclick="fillDest('${esc(src)}')" title="Copiar al destino">${esc(src)}</span>`+
    `<span class="sep"> &gt; </span>`+
    `<span class="dst">${esc(dst)}</span>`+
    (path?`<span class="sep"> via </span><span class="path">${esc(path)}</span>`:'')+
    ` `+
    `<span class="info">${esc(info)}</span>`+
    mapLink;
  log.prepend(d);
  const tsISO=new Date().toISOString();
  logData.unshift({ts:tsISO,type:isAck?'ack':(isToMe?'me':'rx'),src,dst,path,info});
  if(logData.length>MAX_LOG)logData.length=MAX_LOG;
}
function appendSentLog(to,ssid,text){
  const log=document.getElementById('log');
  while(log.children.length>=MAX_LOG)log.removeChild(log.lastChild);
  const d=document.createElement('div');d.className='pkt pkt-sent';
  const ts=new Date().toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  const dest=(ssid>=0&&ssid<=15)?`${to}-${ssid}`:to;
  d.innerHTML=`<span class="ts">${ts}</span>`+
    `<span class="tx-lbl">TX</span>`+
    `<span class="tx-arr"> → </span>`+
    `<span class="dst">${esc(dest)}</span>`+
    ` <span class="info">${esc(text)}</span>`;
  log.prepend(d);
  const tsISO=new Date().toISOString();
  logData.unshift({ts:tsISO,type:'tx',src:myCall+(mySsid>0?'-'+mySsid:''),dst:dest,path:'',info:text});
  if(logData.length>MAX_LOG)logData.length=MAX_LOG;
}
// ── WebSocket (auto-connect + reconexión) ──────────────────────────────────
let ws=null,wsTimer=null;
function setStatus(t){document.getElementById('status').textContent=t;}
function connectWS(){
  if(ws&&ws.readyState<2)return;
  clearTimeout(wsTimer);
  ws=new WebSocket('ws://'+location.host+'/ws');
  ws.binaryType='arraybuffer';
  ws.onopen=()=>{setStatus('Conectado');
    document.getElementById('btn').disabled=false;};
  ws.onmessage=e=>{
    if(e.data instanceof ArrayBuffer){
      if(e.data.byteLength===512&&actx)scheduleBlock(decodeBlock(e.data));
      return;
    }
    try{const p=JSON.parse(e.data);
      if(p.type==='ack_sent'){
        appendSentLog(p.to,p.ssid,'ack'+p.id);
      } else if(p.src!=null)appendLog(p.src,p.dst||'',p.path||'',p.info||'');
    }catch(_){}
  };
  ws.onclose=ws.onerror=()=>{
    setStatus('Desconectado — reconectando…');
    document.getElementById('btn').disabled=true;
    document.getElementById('meter').style.width='0';
    ws=null;nextAt=0;wsTimer=setTimeout(connectWS,5000);
  };
}
// ── Play / Stop ────────────────────────────────────────────────────────────
function toggle(){
  if(actx){actx.close();actx=null;nextAt=0;
    document.getElementById('btn').textContent='▶ Escuchar';
    document.getElementById('meter').style.width='0';return;}
  actx=new(window.AudioContext||window.webkitAudioContext)({sampleRate:SR});
  if(actx.state==='suspended')actx.resume();
  document.getElementById('btn').textContent='⏹ Detener';
}
// ── Send APRS message ──────────────────────────────────────────────────────
function sendAPRS(){
  const to=document.getElementById('send-to').value.trim().toUpperCase();
  const ssid=parseInt(document.getElementById('send-ssid').value,10);
  const text=document.getElementById('send-text').value.trim();
  const st=document.getElementById('send-status');
  if(!to){st.style.color='#c04040';st.textContent='Indica el indicativo destino.';return;}
  if(!text){st.style.color='#c04040';st.textContent='El mensaje no puede estar vacío.';return;}
  const btn=document.getElementById('send-btn');
  btn.disabled=true;st.style.color='#888';st.textContent='Enviando…';
  fetch('/api/aprs/send',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({to,ssid,text})
  }).then(r=>r.json()).then(d=>{
    if(d.ok){st.style.color='#4ac84a';st.textContent='Enviado ✓';appendSentLog(to,ssid,text);}
    else{st.style.color='#c04040';st.textContent='Error del servidor.';}
  }).catch(()=>{
    st.style.color='#c04040';st.textContent='Error de red.';
  }).finally(()=>{btn.disabled=false;});
}
// ── Download log as CSV ────────────────────────────────────────────────────
function csvEsc(s){return'"'+String(s).replace(/"/g,'""')+'"';}
function downloadLog(){
  if(!logData.length){return;}
  const hdr='time,type,src,dst,path,info\n';
  const rows=logData.map(r=>
    [r.ts,r.type||'rx',r.src||'',r.dst||'',r.path||'',r.info||'']
    .map(csvEsc).join(','));
  const blob=new Blob([hdr+rows.join('\n')],{type:'text/csv'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='aprs_log_'+new Date().toISOString().slice(0,19).replace(/[:T]/g,'-')+'.csv';
  a.click();
  URL.revokeObjectURL(a.href);
}
// ── APRS position parser ──────────────────────────────────────────────────
function parseAPRSPos(info){
  if(!info||info.length<18)return null;
  let s=info,first=s[0];
  if(first==='@'||first==='/'){
    // skip 7-char timestamp: DDHHMM + z|h|/
    if(s.length<26)return null;
    s=s.slice(7);
  }else if(first==='!'||first==='='){
    s=s.slice(1);
  }else return null;
  const m=s.match(/^(\d{2})(\d{2}\.\d{2,3})([NS])(.)(\d{3})(\d{2}\.\d{2,3})([EW])(.)(.*)/);
  if(!m)return null;
  const lat=(parseInt(m[1],10)+parseFloat(m[2])/60)*(m[3]==='S'?-1:1);
  const lon=(parseInt(m[5],10)+parseFloat(m[6])/60)*(m[7]==='W'?-1:1);
  if(isNaN(lat)||isNaN(lon)||lat<-90||lat>90||lon<-180||lon>180)return null;
  return{lat:lat.toFixed(5),lon:lon.toFixed(5),sym:m[8],comment:m[9]};
}
// ── APRS format helpers (for beacon TX display) ────────────────────────────
function fmtAPRSLat(lat){
  const d=Math.floor(Math.abs(lat)),m=(Math.abs(lat)-d)*60;
  return String(d).padStart(2,'0')+m.toFixed(2).padStart(5,'0')+(lat>=0?'N':'S');}
function fmtAPRSLon(lon){
  const d=Math.floor(Math.abs(lon)),m=(Math.abs(lon)-d)*60;
  return String(d).padStart(3,'0')+m.toFixed(2).padStart(5,'0')+(lon>=0?'E':'W');}
// ── Tab switching ──────────────────────────────────────────────────────────
function showTab(name,btn){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.tab-pane').forEach(p=>p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tab-'+name).classList.add('active');  if(name==='cfg') loadCfg();}// ── Config editor ───────────────────────────────────────────────────
let cfgLoaded=false;
function loadCfg(){
  if(cfgLoaded) return;
  const ta=document.getElementById('cfg-editor');
  const st=document.getElementById('cfg-status');
  st.style.color='#888';st.textContent='Cargando…';
  fetch('/api/config').then(r=>r.json()).then(d=>{
    ta.value=JSON.stringify(d,null,2);
    st.textContent='';
    cfgLoaded=true;
  }).catch(()=>{st.style.color='#c04040';st.textContent='Error al cargar config.';});
}
function saveCfg(){
  const ta=document.getElementById('cfg-editor');
  const st=document.getElementById('cfg-status');
  const btn=document.getElementById('cfg-save-btn');
  let parsed;
  try{ parsed=JSON.parse(ta.value); }
  catch(e){ st.style.color='#c04040';st.textContent='JSON inválido: '+e.message;return; }
  btn.disabled=true;st.style.color='#888';st.textContent='Guardando…';
  fetch('/api/config',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify(parsed)
  }).then(r=>r.json()).then(d=>{
    if(d.ok){
      st.style.color='#4ac84a';st.textContent='✓ Guardado y aplicado';
      cfgLoaded=false;  // force reload next time tab is opened
    }else{st.style.color='#c04040';st.textContent='Error: '+(d.error||'desconocido');}
  }).catch(()=>{st.style.color='#c04040';st.textContent='Error de red.';}
  ).finally(()=>{btn.disabled=false;});
}// ── GPS ────────────────────────────────────────────────────────────────────
function getGPS(){
  const btn=document.getElementById('gps-btn');
  const st=document.getElementById('pos-status');
  if(!navigator.geolocation){st.style.color='#c04040';st.textContent='GPS no soportado.';return;}
  btn.disabled=true;st.style.color='#888';st.textContent='Obteniendo posición…';
  navigator.geolocation.getCurrentPosition(pos=>{
    document.getElementById('pos-lat').value=pos.coords.latitude.toFixed(5);
    document.getElementById('pos-lon').value=pos.coords.longitude.toFixed(5);
    st.style.color='#4a9a4a';
    st.textContent=`±${Math.round(pos.coords.accuracy)}m ✓`;
    btn.disabled=false;
  },err=>{
    st.style.color='#c04040';st.textContent='GPS: '+err.message;
    btn.disabled=false;
  },{enableHighAccuracy:true,timeout:15000,maximumAge:0});
}
// ── Send APRS beacon ───────────────────────────────────────────────────────
function sendBeacon(){
  const lat=parseFloat(document.getElementById('pos-lat').value);
  const lon=parseFloat(document.getElementById('pos-lon').value);
  const sym=document.getElementById('pos-sym').value;
  const comment=document.getElementById('pos-comment').value.trim();
  const st=document.getElementById('pos-status');
  if(isNaN(lat)||lat<-90||lat>90){st.style.color='#c04040';st.textContent='Latitud inválida (-90…90).';return;}
  if(isNaN(lon)||lon<-180||lon>180){st.style.color='#c04040';st.textContent='Longitud inválida (-180…180).';return;}
  const btn=document.getElementById('pos-btn');
  btn.disabled=true;st.style.color='#888';st.textContent='Enviando…';
  fetch('/api/aprs/beacon',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({lat,lon,symbol:sym,comment})
  }).then(r=>r.json()).then(d=>{
    if(d.ok){
      st.style.color='#4ac84a';st.textContent='Baliza TX ✓';
      appendSentLog('APRS',-1,'!'+fmtAPRSLat(lat)+'/'+fmtAPRSLon(lon)+sym+comment);
    }else{st.style.color='#c04040';st.textContent='Error: '+(d.error||'desconocido');}
  }).catch(()=>{st.style.color='#c04040';st.textContent='Error de red.';}
  ).finally(()=>{btn.disabled=false;});
}
window.addEventListener('load',()=>{connectWS();fetch('/api/me').then(r=>r.json()).then(d=>{myCall=d.call||'';mySsid=d.ssid!=null?d.ssid:-1;}).catch(()=>{});});
</script>
