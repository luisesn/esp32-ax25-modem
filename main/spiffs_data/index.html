<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ESP32 APRS Monitor</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#111;color:#e0e0e0;font-family:monospace;min-height:100vh;padding:1rem}
.app{height:calc(100dvh - 2rem);display:grid;grid-template-rows:1fr 2fr 1fr;gap:1rem;
  max-width:960px;margin:0 auto}
.panel{background:#0d0d0d;border:1px solid #2a2a2a;border-radius:4px;overflow:hidden}
#top-panel{display:flex;flex-direction:column;align-items:center;justify-content:center;
     gap:.9rem;padding:1rem;text-align:center}
h1{font-size:1.2rem;letter-spacing:.1em;color:#7ecfff}
#status{font-size:.8rem;color:#888;min-height:1.2em}
#btn{padding:.7rem 2rem;font-size:1rem;font-family:monospace;background:#1a3a5c;
  color:#7ecfff;border:1px solid #7ecfff;border-radius:4px;cursor:pointer;transition:background .2s}
#btn:hover{background:#254f80}
#btn:disabled{opacity:.4;cursor:default}
#meter-wrap{width:260px;height:12px;background:#1a1a1a;border:1px solid #333;
            border-radius:2px;overflow:hidden}
#meter{height:100%;width:0;
       background:linear-gradient(90deg,#2a8a2a,#8a8a2a,#8a2a2a);transition:width .05s}
#log-hdr{padding:.35rem .6rem;font-size:.7rem;color:#4a9a4a;
         border-bottom:1px solid #1a2a1a;letter-spacing:.08em}
#log-wrap{display:flex;flex-direction:column;min-height:0}
#log{flex:1;min-height:0;overflow-y:auto;padding:.5rem .6rem;
  display:flex;flex-direction:column;gap:.45rem}
.pkt{font-size:.7rem;line-height:1.45}
.pkt .ts{color:#555;margin-right:.5rem}
.pkt .src{color:#7ecfff;font-weight:bold}
.pkt .sep{color:#6d6d6d}
.pkt .dst{color:#f0b35a}
.pkt .path{color:#8acb88}
.pkt .info{color:#c0e0a0;word-break:break-all}
.pkt-sent{background:#1a1400;border-left:2px solid #c8a04a;padding-left:.4rem}
.pkt .tx-lbl{color:#c8a04a;font-weight:bold}
.pkt .tx-arr{color:#6d6d6d}
#info{font-size:.7rem;color:#555;text-align:center;line-height:1.6;margin-top:auto}
#send-hdr{padding:.35rem .6rem;font-size:.7rem;color:#c8a04a;
          border-bottom:1px solid #2a1a00;letter-spacing:.08em}
#send-wrap{display:flex;flex-direction:column}
#send-form{padding:.8rem;display:flex;flex-direction:column;gap:.7rem;justify-content:center;flex:1}
.send-row{display:flex;gap:.4rem;align-items:center}
.send-row label{font-size:.7rem;color:#888;min-width:3.5rem}
.send-row input,.send-row select{
  background:#111;color:#e0e0e0;border:1px solid #333;border-radius:3px;
  font-family:monospace;font-size:.75rem;padding:.3rem .4rem}
#send-to{flex:1;text-transform:uppercase}
#send-ssid{width:3.5rem}
#send-text{flex:1}
#send-btn{padding:.4rem 1rem;font-size:.75rem;font-family:monospace;
          background:#3a2a00;color:#c8a04a;border:1px solid #c8a04a;
          border-radius:3px;cursor:pointer;transition:background .2s;white-space:nowrap}
#send-btn:hover{background:#5a4000}
#send-btn:disabled{opacity:.4;cursor:default}
#send-status{font-size:.65rem;min-height:1rem;color:#888;padding:0 .1rem}
@media (max-width:700px){
  body{padding:.6rem}
  .app{height:auto;min-height:calc(100dvh - 1.2rem);grid-template-rows:auto minmax(16rem,1fr) auto;gap:.75rem}
  #top-panel{padding:.85rem;gap:.7rem}
  .send-row{flex-wrap:wrap}
  .send-row label{min-width:auto}
  #send-to,#send-text{width:100%}
}
</style>
</head>
<body>
<div class="app">
  <div id="top-panel" class="panel">
    <h1>&#x1F4FB; ESP32 APRS Monitor</h1>
    <div id="status">Conectando...</div>
    <button id="btn" onclick="toggle()" disabled>&#x25B6; Escuchar</button>
    <div id="meter-wrap"><div id="meter"></div></div>
    <div id="info">
      IMA ADPCM &middot; 9600 Hz &middot; 38.4 kbps<br>
      VLC/ffplay: <code>http://HOST:8080/audio</code>
    </div>
  </div>
  <div id="log-wrap" class="panel">
    <div id="log-hdr">APRS LOG</div>
    <div id="log"></div>
  </div>
  <div id="send-wrap" class="panel">
    <div id="send-hdr">ENVIAR MENSAJE APRS</div>
    <div id="send-form">
      <div class="send-row">
        <label>Destino</label>
        <input id="send-to" type="text" maxlength="6" placeholder="NO0CAL" spellcheck="false" autocomplete="off">
        <label style="min-width:2rem">SSID</label>
        <select id="send-ssid">
          <option value="-1">—</option>
          <option value="0" selected>0</option>
          <option value="1">1</option><option value="2">2</option>
          <option value="3">3</option><option value="4">4</option>
          <option value="5">5</option><option value="6">6</option>
          <option value="7">7</option><option value="8">8</option>
          <option value="9">9</option><option value="10">10</option>
          <option value="11">11</option><option value="12">12</option>
          <option value="13">13</option><option value="14">14</option>
          <option value="15">15</option>
        </select>
      </div>
      <div class="send-row">
        <label>Mensaje</label>
        <input id="send-text" type="text" maxlength="67" placeholder="Hola desde ESP32-APRS" spellcheck="false">
        <button id="send-btn" onclick="sendAPRS()">&#x2191; Enviar</button>
      </div>
      <div id="send-status"></div>
    </div>
  </div>
</div>
<script>
// ── IMA ADPCM decoder ──────────────────────────────────────────────────────
const STEP=[7,8,9,10,11,12,13,14,16,17,19,21,23,25,28,31,34,37,41,45,50,55,
  60,66,73,80,88,97,107,118,130,143,157,173,190,209,230,253,279,307,337,371,
  408,449,494,544,598,658,724,796,876,963,1060,1166,1282,1411,1552,1707,1878,
  2066,2272,2499,2749,3024,3327,3660,4026,4428,4871,5358,5894,6484,7132,7845,
  8630,9493,10442,11487,12635,13899,15289,16818,18500,20350,22385,24623,27086,
  29794,32767];
const IDX=[-1,-1,-1,-1,2,4,6,8];
function decodeBlock(buf){
  const v=new DataView(buf),raw=new Uint8Array(buf);
  let pred=v.getInt16(0,true),si=Math.min(Math.max(raw[2],0),88);
  const out=new Float32Array(1017);out[0]=pred/32768;let oi=1;
  for(let i=4;i<512;i++){const b=raw[i];
    for(let h=0;h<2;h++){const n=h===0?(b&0xF):(b>>4),st=STEP[si];
      let d=st>>3;if(n&4)d+=st;if(n&2)d+=st>>1;if(n&1)d+=st>>2;
      pred+=(n&8)?-d:d;
      if(pred>32767)pred=32767;if(pred<-32768)pred=-32768;
      si+=IDX[n&7];if(si<0)si=0;if(si>88)si=88;out[oi++]=pred/32768;}}
  return out;
}
// ── AudioContext ───────────────────────────────────────────────────────────
const SR=9600;let actx=null,nextAt=0;
function scheduleBlock(s){
  const b=actx.createBuffer(1,s.length,SR);b.copyToChannel(s,0);
  const n=actx.createBufferSource();n.buffer=b;n.connect(actx.destination);
  const now=actx.currentTime;if(nextAt<now+0.05)nextAt=now+0.05;
  n.start(nextAt);nextAt+=s.length/SR;
  let sum=0;for(let i=0;i<s.length;i++)sum+=s[i]*s[i];
  document.getElementById('meter').style.width=
    Math.min(Math.sqrt(sum/s.length)*400,100)+'%';
}
// ── APRS log ───────────────────────────────────────────────────────────────
const MAX_LOG=100;
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function appendLog(src,dst,path,info){
  const log=document.getElementById('log');
  while(log.children.length>=MAX_LOG)log.removeChild(log.lastChild);
  const d=document.createElement('div');d.className='pkt';
  const ts=new Date().toLocaleTimeString('es',
    {hour:'2-digit',minute:'2-digit',second:'2-digit'});
  d.innerHTML=`<span class="ts">${ts}</span>`+
    `<span class="src">${esc(src)}</span>`+
    `<span class="sep"> &gt; </span>`+
    `<span class="dst">${esc(dst)}</span>`+
    (path?`<span class="sep"> via </span><span class="path">${esc(path)}</span>`:'')+
    ` `+
    `<span class="info">${esc(info)}</span>`;
  log.prepend(d);
}
function appendSentLog(to,ssid,text){
  const log=document.getElementById('log');
  while(log.children.length>=MAX_LOG)log.removeChild(log.lastChild);
  const d=document.createElement('div');d.className='pkt pkt-sent';
  const ts=new Date().toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  const dest=(ssid>=0&&ssid<=15)?`${to}-${ssid}`:to;
  d.innerHTML=`<span class="ts">${ts}</span>`+
    `<span class="tx-lbl">TX</span>`+
    `<span class="tx-arr"> → </span>`+
    `<span class="dst">${esc(dest)}</span>`+
    ` <span class="info">${esc(text)}</span>`;
  log.prepend(d);
}
// ── WebSocket (auto-connect + reconexión) ──────────────────────────────────
let ws=null,wsTimer=null;
function setStatus(t){document.getElementById('status').textContent=t;}
function connectWS(){
  if(ws&&ws.readyState<2)return;
  clearTimeout(wsTimer);
  ws=new WebSocket('ws://'+location.host+'/ws');
  ws.binaryType='arraybuffer';
  ws.onopen=()=>{setStatus('Conectado');
    document.getElementById('btn').disabled=false;};
  ws.onmessage=e=>{
    if(e.data instanceof ArrayBuffer){
      if(e.data.byteLength===512&&actx)scheduleBlock(decodeBlock(e.data));
      return;
    }
    try{const p=JSON.parse(e.data);
      if(p.src!=null)appendLog(p.src,p.dst||'',p.path||'',p.info||'');
    }catch(_){}
  };
  ws.onclose=ws.onerror=()=>{
    setStatus('Desconectado — reconectando…');
    document.getElementById('btn').disabled=true;
    document.getElementById('meter').style.width='0';
    ws=null;nextAt=0;wsTimer=setTimeout(connectWS,5000);
  };
}
// ── Play / Stop ────────────────────────────────────────────────────────────
function toggle(){
  if(actx){actx.close();actx=null;nextAt=0;
    document.getElementById('btn').textContent='▶ Escuchar';
    document.getElementById('meter').style.width='0';return;}
  actx=new(window.AudioContext||window.webkitAudioContext)({sampleRate:SR});
  if(actx.state==='suspended')actx.resume();
  document.getElementById('btn').textContent='⏹ Detener';
}
// ── Send APRS message ──────────────────────────────────────────────────────
function sendAPRS(){
  const to=document.getElementById('send-to').value.trim().toUpperCase();
  const ssid=parseInt(document.getElementById('send-ssid').value,10);
  const text=document.getElementById('send-text').value.trim();
  const st=document.getElementById('send-status');
  if(!to){st.style.color='#c04040';st.textContent='Indica el indicativo destino.';return;}
  if(!text){st.style.color='#c04040';st.textContent='El mensaje no puede estar vacío.';return;}
  const btn=document.getElementById('send-btn');
  btn.disabled=true;st.style.color='#888';st.textContent='Enviando…';
  fetch('/api/aprs/send',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({to,ssid,text})
  }).then(r=>r.json()).then(d=>{
    if(d.ok){st.style.color='#4ac84a';st.textContent='Enviado ✓';appendSentLog(to,ssid,text);}
    else{st.style.color='#c04040';st.textContent='Error del servidor.';}
  }).catch(()=>{
    st.style.color='#c04040';st.textContent='Error de red.';
  }).finally(()=>{btn.disabled=false;});
}
window.addEventListener('load',connectWS);
</script>
</body>
</html>
